name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}

      - name: Rustfmt Check
        working-directory: ./app/src/main/rust
        run: cargo fmt --all -- --check

      - name: Clippy Check
        working-directory: ./app/src/main/rust
        run: cargo clippy --target aarch64-linux-android --all-features -- -D warnings

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Spotless Check
        run: ./gradlew spotlessCheck

  default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      # libavif LocalDav1d builds dav1d with meson (decode-only AV1 for PQ AVIF).
      # nasm is required for x86_64 asm when -Denable_asm=true (arm64 uses gas).
      - name: Install meson/nasm (dav1d)
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-default-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-default-

      - name: Build
        run: ./gradlew assembleDefaultRelease

      # Artifact channel token must match BuildConfig.RELEASE_CHANNEL (default | easytier)
      # so in-app CI update picks the same build family as the installed app.
      - name: Detect release channel
        id: channel
        run: |
          if [ -f app/src/main/jniLibs/arm64-v8a/libeasytier_android_jni.so ]; then
            echo "name=easytier" >> "$GITHUB_OUTPUT"
          else
            echo "name=default" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.channel.outputs.name }}-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk

      - name: Upload x86_64
        if: steps.channel.outputs.name == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.channel.outputs.name }}-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-x86_64-release.apk

      - name: Upload ARM32
        if: steps.channel.outputs.name == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.channel.outputs.name }}-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-armeabi-v7a-release.apk

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.channel.outputs.name }}-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/defaultRelease/*.txt

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.channel.outputs.name }}-native-debug-symbols-${{ github.sha }}
          path: app/build/outputs/native-debug-symbols/defaultRelease/native-debug-symbols.zip
